name: Taskflow CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  workflow_dispatch:
env:
  DOCKER_USER: joaobarbosa404

jobs:

  test-frontend:
    name: Testes - Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm run test


  test-backend:
    name: Testes - Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test


  build:
    name: Build e Push Docker
    runs-on: ubuntu-latest

    needs:
      - test-frontend
      - test-backend

    # Só publica imagens quando for push na branch main
    #if: github.event_name == 'push' && github.ref == 'refs/heads/main'#

    if: |
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar tag da imagem
        id: image
        run: |
          TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "================================="
          echo "Commit SHA: ${GITHUB_SHA::7}"
          echo "Run Number: ${GITHUB_RUN_NUMBER}"
          echo "Image Tag: ${TAG}"
          echo "================================="

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/taskflow-backend:${{ steps.image.outputs.tag }}
            ${{ env.DOCKER_USER }}/taskflow-backend:latest

      - name: Build e Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/taskflow-frontend:${{ steps.image.outputs.tag }}
            ${{ env.DOCKER_USER }}/taskflow-frontend:latest