name: Taskflow CI/CD
on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKER_USER: joaobarbosa404

jobs:

  test-frontend:
    name: Testes - Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm run test


  test-backend:
    name: Testes - Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test


  sonarqube:
    name: Análise - SonarQube Cloud
    runs-on: ubuntu-latest

    needs:
      - test-frontend
      - test-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300


  build-trivyscan-push:
    name: Build, Trivy e Push das imagens
    runs-on: ubuntu-latest

    needs:
      - test-frontend
      - test-backend
      - sonarqube

    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    outputs:
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar tag da imagem
        id: image
        run: |
          TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "================================="
          echo "Commit SHA: ${GITHUB_SHA::7}"
          echo "Run Number: ${GITHUB_RUN_NUMBER}"
          echo "Image Tag: ${TAG}"
          echo "================================="

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.DOCKER_USER }}/taskflow-backend:${{ steps.image.outputs.tag }}

      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.DOCKER_USER }}/taskflow-frontend:${{ steps.image.outputs.tag }}

      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_USER }}/taskflow-backend:${{ steps.image.outputs.tag }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_USER }}/taskflow-frontend:${{ steps.image.outputs.tag }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/taskflow-backend:${{ steps.image.outputs.tag }}
            ${{ env.DOCKER_USER }}/taskflow-backend:latest

      - name: Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/taskflow-frontend:${{ steps.image.outputs.tag }}
            ${{ env.DOCKER_USER }}/taskflow-frontend:latest


  deploy-new-version:
    name: Deploy
    runs-on: ubuntu-latest

    needs:
      - build-trivyscan-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar imagens nos Deployments
        env:
          TAG: ${{ needs.build-trivyscan-push.outputs.tag }}
        run: |
          set -euo pipefail

          BACKEND_FILE="k8s/backend/deployment.yaml"
          FRONTEND_FILE="k8s/frontend/deployment.yaml"

          test -f "$BACKEND_FILE" || {
            echo "Manifest não encontrado: $BACKEND_FILE"
            exit 1
          }

          test -f "$FRONTEND_FILE" || {
            echo "Manifest não encontrado: $FRONTEND_FILE"
            exit 1
          }

          sed -i -E \
            "s|(image:[[:space:]]*${DOCKER_USER}/taskflow-backend:).*|\\1${TAG}|" \
            "$BACKEND_FILE"

          sed -i -E \
            "s|(image:[[:space:]]*${DOCKER_USER}/taskflow-frontend:).*|\\1${TAG}|" \
            "$FRONTEND_FILE"

          echo "Imagens após atualização:"

          grep -n 'image:' "$BACKEND_FILE"
          grep -n 'image:' "$FRONTEND_FILE"

          # Falha se as imagens esperadas não foram encontradas.
          grep -Fq \
            "image: ${DOCKER_USER}/taskflow-backend:${TAG}" \
            "$BACKEND_FILE"

          grep -Fq \
            "image: ${DOCKER_USER}/taskflow-frontend:${TAG}" \
            "$FRONTEND_FILE"

      - name: Commit e Push dos manifests
        env:
          TAG: ${{ needs.build-trivyscan-push.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            k8s/backend/deployment.yaml \
            k8s/frontend/deployment.yaml

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos manifests."
            exit 0
          fi

          git commit -m "chore(k8s): atualizar imagens para ${TAG}"

          git push origin "HEAD:${GITHUB_REF_NAME}"