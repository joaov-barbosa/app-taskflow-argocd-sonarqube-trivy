apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: taskflow

spec:

  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: joaobarbosa404/taskflow-backend:1.0.0

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 3000

          envFrom:

            - configMapRef:
                name: taskflow-backend-config

            - secretRef:
                name: taskflow-backend-secret

          readinessProbe:

            httpGet:
              path: /ready
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:

            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 10
            periodSeconds: 10

          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi