apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: taskflow

spec:

  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:

    metadata:
      labels:
        app: redis

    spec:

      containers:

        - name: redis

          image: redis:7-alpine

          args:
            - redis-server
            - --appendonly
            - "yes"

          ports:

            - containerPort: 6379

          resources:

            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi