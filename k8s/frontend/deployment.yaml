apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: taskflow

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

        - name: frontend

          image: joaobarbosa404/taskflow-frontend:1.0.0

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 80
          env:
           - name: BACKEND_HOST
             value: backend-service

           - name: BACKEND_PORT
             value: "3000"

          readinessProbe:

            httpGet:
              path: /health
              port: 80

            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:

            httpGet:
              path: /health
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 10

          resources:

            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 128Mi