services:

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    volumes:
      - redis-data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    networks:
      - taskflow


  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_VERSION: ${APP_VERSION:-1.0.0}
      NODE_ENV: production

    depends_on:
      - redis

    networks:
      - taskflow


  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    depends_on:
      - backend

    networks:
      - taskflow


volumes:

  redis-data:


networks:

  taskflow: